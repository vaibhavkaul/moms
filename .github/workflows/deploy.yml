name: Deploy moms

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-2
  ROLE_ARN: arn:aws:iam::497554915605:role/vaibot-role
  S3_BUCKET: moms.kidsartto.life

jobs:
  deploy:
    name: Build, sync to S3, invalidate CloudFront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::497554915605:role/vaibot-role
          role-duration-seconds: 1800
          role-skip-session-tagging: true

      - name: Sync to S3
        run: |
          # Assets: long-lived immutable cache; index.html: no-cache
          aws s3 sync dist/ "s3://${S3_BUCKET}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html "s3://${S3_BUCKET}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
